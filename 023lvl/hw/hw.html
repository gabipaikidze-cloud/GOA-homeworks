
<!DOCTYPE html>
<html>
<head>
    <title>Level 23</title>
</head>
<body>

    <h1>1. Choose Your Favorite Fruit</h1>

    <select>
        <option>Apple</option>
        <option>Banana</option>
        <option>Orange</option>
        <option>Strawberry</option>
        <option>Watermelon</option>
    </select>

    <hr>

    <h1>2. Choose Your Favorite Animal</h1>

    <select>
        <option>Dog</option>
        <option>Cat</option>
        <option>Lion</option>
        <option>Tiger</option>
        <option>Rabbit</option>
    </select>

    <hr>

    <h1>3. Choose a Day</h1>

    <select>
        <option disabled selected>Choose a day</option>
        <option>Monday</option>
        <option>Tuesday</option>
        <option>Wednesday</option>
        <option>Thursday</option>
        <option>Friday</option>
        <option>Saturday</option>
        <option>Sunday</option>
    </select>

    <hr>

    <h1>4. Choose Your Favorite Color</h1>

    <select>
        <option disabled selected>Choose your favorite color</option>
        <option>Red</option>
        <option>Blue</option>
        <option>Green</option>
        <option>Yellow</option>
        <option>Black</option>
        <option>White</option>
    </select>

    <hr>

    <h1>5. Choose Your Age</h1>

    <select>
        <option disabled selected>Choose your age</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
        <option>13</option>
        <option>14</option>
        <option>15</option>
        <option>16</option>
        <option>17</option>
        <option>18</option>
    </select>

    <hr>

    <h1>6. Number Input</h1>

    <input type="number" min="10" required>

    <hr>

    <h1>7. Number Input (1-100)</h1>

    <input type="number" min="1" max="100" required>

    <hr>

    <h1>8. Enter Your Age</h1>

    <label>Enter your age:</label>
    <input type="number" min="18" max="100" required>

    <hr>

    <h1>9. Enter Your Score</h1>

    <label>Enter your score:</label>
    <input type="number" min="0" max="100" required>

    <hr>

    <h1>10. Registration Form</h1>

    <form>
        <label>Username:</label>
        <input type="text" required>

        <br><br>

        <label>Age:</label>
        <input type="number" min="18" max="100" required>

        <br><br>

        <label>Country:</label>

        <select required>
            <option disabled selected>Choose your country</option>
            <option>Georgia</option>
            <option>France</option>
            <option>Germany</option>
            <option>Italy</option>
            <option>Spain</option>
        </select>

        <br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
