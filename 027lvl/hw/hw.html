<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Level 27</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1) h1 - Inline -->
    <h1 style="color: blue;">
        ლურჯი სათაური
    </h1>

    <!-- 2) p - Inline -->
    <p style="font-size: 20px; color: green;">
        მწვანე ტექსტი 20px ზომით
    </p>

    <!-- 3) div - Inline -->
    <div style="width: 250px; height: 150px; background-color: yellow; border: 3px solid black;">
        DIV 1
    </div>

    <!-- 4) h2 - Inline -->
    <h2 style="background-color: black; color: white;">
        თეთრი ტექსტი შავ ფონზე
    </h2>

    <!-- 5) span - External CSS -->
    <span class="span1">
        Purple Span
    </span>

    <br><br>

    <!-- 6) button - Inline -->
    <button style="background-color: blue; color: white; font-size: 18px;">
        დააჭირე ღილაკს
    </button>

    <br><br>

    <!-- 7) div - External CSS -->
    <div class="box2">
        DIV 2
    </div>

    <!-- 8) h3 - Inline -->
    <h3 style="color: brown; font-size: 30px;">
        Brown სათაური
    </h3>

    <!-- 9) p - External CSS -->
    <p class="paragraph">
        ეს არის Lightblue ფონის მქონე ტექსტი.
    </p>

    <!-- 10) span - Inline -->
    <span style="color: red; background-color: yellow; font-size: 22px;">
        Red Span
    </span>

</body>
</html>
