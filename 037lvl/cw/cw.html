
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 37</title>
    <link rel="stylesheet" href="cw.css">
</head>
<body>

    <h2>დავალება 1 - justify-content: center</h2>
    <div class="container container1">
        <div class="card">ბარათი 1</div>
        <div class="card">ბარათი 2</div>
        <div class="card">ბარათი 3</div>
    </div>

    <h2>დავალება 2 - space-between</h2>
    <div class="container container2">
        <div class="small-card">1</div>
        <div class="small-card">2</div>
        <div class="small-card">3</div>
        <div class="small-card">4</div>
    </div>

    <h2>დავალება 3 - align-items: center</h2>
    <div class="container container3">
        <div class="height-card card1">დაბალი</div>
        <div class="height-card card2">საშუალო</div>
        <div class="height-card card3">მაღალი</div>
    </div>

    <h2>დავალება 4 - space-around</h2>
    <div class="container container4">
        <div class="block red"></div>
        <div class="block blue"></div>
        <div class="block green"></div>
        <div class="block orange"></div>
    </div>

    <h2>დავალება 5 - align-items: flex-end</h2>
    <div class="container container5">
        <div class="bottom-card">ბარათი 1</div>
        <div class="bottom-card">ბარათი 2</div>
        <div class="bottom-card">ბარათი 3</div>
    </div>

</body>
</html>
