
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 37</title>
    <link rel="stylesheet" href="hw.css">
</head>
<body>

    <h2>დავალება 1 - flex-start</h2>
    <div class="container container1">
        <div class="card">ბარათი 1</div>
        <div class="card">ბარათი 2</div>
        <div class="card">ბარათი 3</div>
        <div class="card">ბარათი 4</div>
        <div class="card">ბარათი 5</div>
    </div>

    <h2>დავალება 2 - flex-end</h2>
    <div class="container container2">
        <div class="block red"></div>
        <div class="block blue"></div>
        <div class="block green"></div>
        <div class="block orange"></div>
    </div>

    <h2>დავალება 3 - flex-start</h2>
    <div class="container container3">
        <div class="height-card">ბარათი 1</div>
        <div class="height-card">ბარათი 2</div>
        <div class="height-card">ბარათი 3</div>
    </div>

    <h2>დავალება 4 - space-evenly</h2>
    <div class="container container4">
        <div class="small-card">1</div>
        <div class="small-card">2</div>
        <div class="small-card">3</div>
        <div class="small-card">4</div>
        <div class="small-card">5</div>
    </div>

    <h2>დავალება 5 - stretch</h2>
    <div class="container container5">
        <div class="stretch-card">ბარათი 1</div>
        <div class="stretch-card">ბარათი 2</div>
        <div class="stretch-card">ბარათი 3</div>
        <div class="stretch-card">ბარათი 4</div>
    </div>

</body>
</html>
